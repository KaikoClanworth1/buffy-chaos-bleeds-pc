[Mod]
Name = Story character outfits
Author = Buffy PC port
Version = 1.0
Description = More outfits for the story characters, from their cutscene and special models: on the in-level Character Select (Player 1 Change Character and Story co-op), X changes the highlighted character's outfit (each player picks their own), then A picks. Buffy 3 outfits, Willow 4, Xander 3, Faith 3, Spike 2. Needs Player 1 Change Character or Story co-op for the page.

[Outfits]
; a story character = more outfits, as model:skin (hex hash of the model file)
Buffy = 01000060:0, 01000045:1
Willow = 0100005F:0, 0100005F:1, 01000036:0
Xander = 01000061:0, 01000037:1
Spike = 0100006A:0
Faith = 0100006B:0, 01000039:0
