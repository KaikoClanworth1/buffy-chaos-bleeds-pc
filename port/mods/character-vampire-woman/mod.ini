[Mod]
Name = Vampire (Woman)
Author = Buffy PC port
Version = 1.0
Description = Vampire (Woman) (every look the story's female vampires have) joins the in-level Character Select (Player 1 Change Character and Story co-op), after the story characters. The story model is put on a story character's rig - the bones converted, so every player animation drives it - and plays as that character: Faith's moves, weapons, pickups and story part. On the Character Select, X changes the outfit (each player picks their own) - 10 outfits. Needs Player 1 Change Character or Story co-op for the page.

[Character]
; whose moves, spells and inventory they take (0 Buffy, 1 Willow, 2 Xander, 3 Spike, 4 Sid, 5 Faith)
BaseCharacter = 5
; the model file worn (hex hash) and its skin: the first outfit
Model = 0100001D
ModelSkin = 2
; more outfits (X on the Character Select): model:skin, or model:first-last
Outfits = 0100001D:1, 0100001D:3-10
; the roster portrait the page slot borrows (-1: the first free one)
Portrait = 5
