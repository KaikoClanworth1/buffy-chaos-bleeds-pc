[Mod]
Name = Always play as Willow
Author = Buffy PC port
Version = 1.0
Description = Every story level is played as Willow, whoever the level normally has you play (Buffy, Xander, Spike, Faith). Levels that switch character part way through keep you as Willow. Multiplayer is not affected. Pairs well with "Willow: every spell from the start". A level written around another character's abilities may be harder or not finishable as Willow; untick the mod to play it normally.

[Patches]
AlwaysPlayAsWillow = 1
