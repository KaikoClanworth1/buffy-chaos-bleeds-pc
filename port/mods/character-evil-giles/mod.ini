[Mod]
Name = Evil Giles
Author = Buffy PC port
Version = 1.0
Description = Evil Giles (Ripper, the boss) joins the in-level Character Select (Player 1 Change Character and Story co-op), after the story characters. His boss model is put on a story character's rig - the bones converted, so every player animation drives him - and he plays as that character: with Willow (the default) her spells, stake, pickups and story part. On the Character Select, X changes the outfit (each player picks their own). The other outfit is the Ripper, his demon form. Needs Player 1 Change Character or Story co-op for the page.

[Character]
; whose moves, spells and inventory he takes (0 Buffy, 1 Willow, 2 Xander, 3 Spike, 4 Sid, 5 Faith)
BaseCharacter = 1
; the model file he wears (hex hash of b02_gile.edb, the Ripper boss) and its skin
Model = 01000026
ModelSkin = 0
; more outfits (X on the Character Select): the Ripper, his demon form
Outfits = 01000034:2
; the roster portrait his page slot borrows (-1: the first free one); there is no Giles portrait in the roster
Portrait = -1

; the model edited in Blender (a .glb from the launcher's Advanced tab), in this folder:
; its bones and vertices replace the game model's (same mesh: move, scale, re-pose the rest)
; ModelFile = model.glb
