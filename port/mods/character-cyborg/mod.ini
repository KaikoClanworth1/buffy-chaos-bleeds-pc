[Mod]
Name = Cyborg
Author = Buffy PC port
Version = 1.0
Description = Cyborg (the Initiative cyborg enemy) joins the in-level Character Select (Player 1 Change Character and Story co-op), after the story characters. The story model is put on a story character's rig - the bones converted, so every player animation drives it - and plays as that character: Buffy's moves, weapons, pickups and story part. On the Character Select, X changes the outfit (each player picks their own) - 3 outfits. Needs Player 1 Change Character or Story co-op for the page.

[Character]
; whose moves, spells and inventory they take (0 Buffy, 1 Willow, 2 Xander, 3 Spike, 4 Sid, 5 Faith)
BaseCharacter = 0
; the model file worn (hex hash) and its skin: the first outfit
Model = 01000029
ModelSkin = 0
; more outfits (X on the Character Select): model:skin, or model:first-last
Outfits = 01000029:1-2
; the roster portrait the page slot borrows (-1: the first free one)
Portrait = -1
