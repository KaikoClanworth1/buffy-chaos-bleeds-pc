[Mod]
Name = Story co-op (experimental)
Author = Buffy PC port
Version = 0.5
Description = A second player joins the story. During a level, press Start on controller 2 and pick any of the 24 characters on the multiplayer Character Select (A picks, B backs out); you appear beside player 1 while they keep playing. The inventory is shared - anything either player picks up (keys too) is in both hands - but each player selects their own item; each character keeps their own spells and weapon. Player 2's Start opens their own menu: Continue, Change Character, Drop Out. Player 2's Back brings them to player 1 (for when they get stuck). If player 2 falls they get back up beside player 1 a few seconds later. Player 1's pause menu has a Co-op page: Screens (Two Windows, Split Screen or One Screen), Friendly Fire, Shared Inventory, Back Brings Player 2, Player 2 Respawn time, and Drop Out Player 2 - saved in buffy_settings.ini. StoryCoopScreens below is the starting choice for Screens (1 one screen, 2 two windows, 3 split screen). Early work: only the first mission has been tried.

[Patches]
StoryCoop = 1
StoryCoopScreens = 2
