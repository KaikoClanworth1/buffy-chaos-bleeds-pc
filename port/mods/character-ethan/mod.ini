[Mod]
Name = Ethan Rayne
Author = Buffy PC port
Version = 1.0
Description = Ethan Rayne (the chaos sorcerer from the story) joins the in-level Character Select (Player 1 Change Character and Story co-op), after the story characters. The story model is put on a story character's rig - the bones converted, so every player animation drives it - and plays as that character: Willow's moves, weapons, pickups and story part. On the Character Select, X changes the outfit (each player picks their own) - his two boss models. Needs Player 1 Change Character or Story co-op for the page.

[Character]
; whose moves, spells and inventory they take (0 Buffy, 1 Willow, 2 Xander, 3 Spike, 4 Sid, 5 Faith)
BaseCharacter = 1
; the model file worn (hex hash) and its skin: the first outfit
Model = 01000025
ModelSkin = 0
; more outfits (X on the Character Select): model:skin, or model:first-last
Outfits = 01000057:0
; the roster portrait the page slot borrows (-1: the first free one)
Portrait = -1
