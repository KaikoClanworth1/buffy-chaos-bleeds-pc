[Mod]
Name = Tara
Author = Buffy PC port
Version = 1.0
Description = Tara joins the in-level Character Select (Player 1 Change Character and Story co-op), in the slot after the six story characters. She plays as Willow - the same moves, spells, inventory and story part - with Tara's own look from the multiplayer roster, and Willow's voice and sounds. On the Character Select, X changes the outfit (each player picks their own). Her story boss model and vampire Tara are the other two outfits. Needs Player 1 Change Character or Story co-op for the page.

[Character]
; the story character whose moves, spells and inventory she takes (0 Buffy, 1 Willow, 2 Xander, 3 Spike, 4 Sid, 5 Faith)
BaseCharacter = 1
; the character-sheet row whose look she wears (skin and portrait); it must share the base character's model file
LookRow = 8
; 1: the look row's own voice and sounds too (Tara's multiplayer set has no story lines, so she keeps Willow's)
LookSounds = 0
; more outfits (X on the Character Select): her story boss model, vampire Tara
Outfits = 0100003F:1, 0100003D:3
